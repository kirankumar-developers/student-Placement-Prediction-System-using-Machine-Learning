{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="custom-card col-md-8 mx-auto p-5">
        <i class="fa-solid fa-compass-drafting display-1 text-primary mb-3"></i>
        <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">The requested page or endpoint could not be found.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-custom">
            <i class="fa-solid fa-house me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
